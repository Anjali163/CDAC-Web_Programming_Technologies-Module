<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNova | New Joiner Onboarding</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="portal-nav"><a href="login.html">Login</a><a href="directory.html">Directory</a><a href="onboarding.html">Onboarding</a></nav>
  <main class="portal-container onboarding-container">
    <header class="portal-heading"><p class="eyebrow">WELCOME ABOARD</p><h1>New joiner form</h1><p>Complete the details below to start your onboarding. Use sample data only for this assignment.</p></header>
    <form class="portal-form" action="#" method="post" enctype="multipart/form-data">
      <div class="portal-form-grid">
        <div class="portal-field"><label for="full-name">Full name</label><input id="full-name" name="full-name" type="text" placeholder="Enter full name" required></div>
        <div class="portal-field"><label for="official-email">Official email</label><input id="official-email" name="official-email" type="email" placeholder="name@technova.example" required></div>
        <div class="portal-field"><label for="temporary-password">Temporary password</label><input id="temporary-password" name="temporary-password" type="password" placeholder="Create temporary password" required></div>
        <div class="portal-field"><label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required></div>
        <div class="portal-field"><label for="joining-date">Joining date</label><input id="joining-date" name="joining-date" type="date" required></div>
        <div class="portal-field"><label for="orientation-slot">Orientation slot</label><input id="orientation-slot" name="orientation-slot" type="datetime-local" required></div>
        <div class="portal-field"><label for="reporting-time">Reporting time on day one</label><input id="reporting-time" name="reporting-time" type="time" required></div>
        <fieldset class="portal-radio"><legend>Gender</legend><label><input id="gender-female" name="gender" type="radio" value="female"> Female</label><label><input id="gender-male" name="gender" type="radio" value="male"> Male</label><label><input id="gender-other" name="gender" type="radio" value="other"> Prefer not to say / Other</label></fieldset>
        <div class="portal-field"><label for="qualification">Highest qualification</label><select id="qualification" name="qualification" required><option value="">Select qualification</option><option value="diploma">Diploma</option><option value="bachelors">Bachelor's degree</option><option value="masters">Master's degree</option><option value="doctorate">Doctorate</option><option value="other">Other</option></select></div>
        <div class="portal-field"><label for="department">Department</label><select id="department" name="department" required><option value="">Select department</option><option value="engineering">Engineering</option><option value="hr">Human Resources</option><option value="finance">Finance</option><option value="marketing">Marketing</option><option value="operations">Operations</option></select></div>
        <div class="portal-field full-span"><label for="address">Current address</label><textarea id="address" name="address" rows="4" placeholder="Enter current address" required></textarea></div>
        <div class="portal-field full-span"><label for="document">Passport photo or resume</label><input id="document" name="document" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"></div>
        <div class="portal-field full-span declaration"><label for="declaration"><input id="declaration" name="declaration" type="checkbox" required> I declare that the information provided is accurate.</label></div>
      </div>
      <div class="portal-actions"><button class="portal-button" type="submit">Submit form</button><button class="portal-button secondary" type="reset">Reset</button>
        <!-- This plain button is a visual placeholder; help functionality has not been implemented yet. -->
        <button class="portal-button help-button" type="button">Need help?</button>
      </div>
    </form>
    <section class="office-map"><h2>TechNova office location</h2><p>Illustrative map embed for the imaginary company office.</p><iframe title="Map showing a sample TechNova office area" src="https://www.google.com/maps?q=Hinjawadi%2C%20Pune&output=embed" width="100%" height="280" loading="lazy"></iframe></section>
  </main>
  <footer class="portal-footer">TechNova Solutions · Internal demo portal</footer>
</body>
</html>
