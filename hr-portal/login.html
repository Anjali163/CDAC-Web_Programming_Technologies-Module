<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNova | Employee Login</title><link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <nav class="portal-nav"><a href="login.html">Login</a><a href="directory.html">Directory</a><a href="onboarding.html">Onboarding</a></nav>
  <main class="login-main">
    <div class="login-card">
      <div class="portal-logo">TN</div>
      <p class="eyebrow">TECHNOVA SOLUTIONS</p>
      <h1>Welcome back</h1><p>Sign in to continue to your workspace.</p>
      <form action="#" method="post">
        <label class="visually-hidden" for="username">Username</label><input class="login-input" id="username" name="username" type="text" placeholder="Username" required>
        <label class="visually-hidden" for="password">Password</label><input class="login-input" id="password" name="password" type="password" placeholder="Password" required>
        <button id="login-button" type="submit">Login</button>
      </form>
      <p class="signup-line">Need an account? <a href="onboarding.html">Sign Up</a></p>
      <p class="demo-note">Demo page only — authentication is not connected.</p>
    </div>
  </main>
</body>
</html>
